name = "jx-briefing"
main = "worker.js"
compatibility_date = "2024-01-01"

# Secrets (wrangler secret put):
#   LIDO_USER, LIDO_PASS   — LIDO 自動登入
#   GEMINI_API_KEY          — Gemini AI
#   UPLOAD_TOKEN            — iOS Shortcut 上傳憑證
#   NOTICE_IMPORT_TOKEN     — 雲端橋接專用，只允許結構化公告匯入
#   ELB_USER, ELB_PASS      — ELB（sjx.ultramain.systems）登入，沿用舊 ELB 帳密；現為必填
#                             以 `wrangler secret put ELB_USER` / `ELB_PASS` 設定，勿寫入此檔或任何 repo 檔案
# ELB 新站（2026-11-23）要求登入授權；/auth/elb 以 ELB_USER / ELB_PASS 表單登入，getBearerToken 回傳 204 時使用 cookie session，有 token 時另送 WS authorization；以實際機號查詢驗證授權

[[kv_namespaces]]
binding = "NOTICES_KV"
id = "6430558b8a944c15949ad9d4a88944ab"
# 建立方式：wrangler kv namespace create NOTICES_KV
# 建立後把回傳的 id 填到上面這行
